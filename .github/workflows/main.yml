name: Training & Docker Pipeline (Advance)

on:
  push:
    branches:
      - main
  # Opsional: Trigger manual agar bisa diklik run kapan saja
  workflow_dispatch:

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 1. SETUP PYTHON (DENGAN CACHE AGAR CEPAT)
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'
        
    # 2. INSTALL LIBRARY (ANTI-MACET/HANG)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # --prefer-binary mencegah kompilasi ulang yang bikin lama
        pip install mlflow==2.19.0 pandas scikit-learn matplotlib dagshub --prefer-binary

    # 3. TRAINING (SOLUSI ERROR "FATAL GIT")
    # Kita masuk dulu ke foldernya (cd), baru jalankan mlflow run di titik (.) itu.
    - name: Run MLflow Training via MLflow Project
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        # Token user wajib ada agar script bisa akses DagsHub tanpa login browser
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }} 
      run: |
        cd MLProject
        mlflow run . --env-manager=local --experiment-name CI_Pipeline_Training

    # 4. LOGIN DOCKER
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. BUILD IMAGE
    - name: Build Docker Image
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        # Script build_docker.py akan mencari run ID terakhir secara otomatis
        python MLProject/build_docker.py

    # 6. PUSH IMAGE
    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/submission-ml-eka:latest