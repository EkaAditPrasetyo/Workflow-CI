name: Training & Docker Pipeline (Advance)

on:
  push:
    branches:
      - main
    # Opsional: Trigger manual agar bisa diklik run kapan saja
    workflow_dispatch:

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    # 1. Install Library
    - name: Install Dependencies
      run: |
        pip install mlflow==2.19.0 pandas scikit-learn matplotlib dagshub

    # 2. TRAINING (Core Step)
    # Perbaikan: Path harus lengkap ke 'Workflow-CI/MLProject'
    - name: Run MLflow Training via MLflow Project
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        # Pastikan environment variable ini ada agar script modelling.py tidak error
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }} 
      run: |
        # --env-manager=local: Memakai environment python yang sudah diinstall di step sebelumnya (lebih cepat)
        mlflow run Workflow-CI/MLProject --env-manager=local

    # 3. Login Docker
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. BUILD IMAGE
    # Perbaikan: Path script build_docker.py juga harus lengkap
    - name: Build Docker Image
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        python Workflow-CI/MLProject/build_docker.py

    # 5. PUSH IMAGE
    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/submission-ml-eka:latest